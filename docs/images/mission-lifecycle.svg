<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Pi Missions durable mission lifecycle</title>
<desc id="desc">A mission is created, features move through pending, active, done or blocked states, evidence and history persist on disk, and a later Pi session resumes the same mission.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1117"/><stop offset="1" stop-color="#151b24"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ee7b7"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".24"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><g opacity=".15" stroke="#728096"><path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600"/><path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/></g>
<text x="90" y="92" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="42" font-weight="700">A mission survives the session.</text>
<text x="90" y="136" fill="#9aa7b6" font-family="system-ui, sans-serif" font-size="22">Durable feature state, explicit evidence, and a resumable handoff back into Pi.</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" filter="url(#shadow)">
<rect x="90" y="210" width="330" height="210" rx="24" fill="#111820" stroke="#334155"/><text x="125" y="255" fill="#93c5fd" font-size="18">01  CREATE / LOAD</text><text x="125" y="305" fill="#f8fafc" font-size="26">/mission start</text><text x="125" y="343" fill="#cbd5e1" font-size="18">"Implement user auth"</text><rect x="125" y="370" width="155" height="30" rx="15" fill="#172554"/><text x="145" y="391" fill="#bfdbfe" font-size="14">mission active</text>
<rect x="515" y="210" width="510" height="330" rx="24" fill="#111820" stroke="#334155"/><text x="550" y="255" fill="#6ee7b7" font-size="18">02  FEATURE QUEUE</text><rect x="550" y="290" width="200" height="66" rx="14" fill="#171f2a" stroke="#475569"/><text x="575" y="320" fill="#94a3b8" font-size="14">F001</text><text x="575" y="343" fill="#f8fafc" font-size="18">pending</text><path d="M750 323H810" stroke="#64748b" stroke-width="3"/><path d="M802 315l12 8-12 8" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="815" y="290" width="170" height="66" rx="14" fill="#10251f" stroke="#34d399"/><text x="840" y="320" fill="#a7f3d0" font-size="14">F002</text><text x="840" y="343" fill="#ecfdf5" font-size="18">active</text>
<path d="M900 356V402" stroke="#64748b" stroke-width="3"/><path d="M892 394l8 12 8-12" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="600" y="420" width="160" height="66" rx="14" fill="#10251f" stroke="#22c55e"/><text x="625" y="450" fill="#86efac" font-size="14">evidence saved</text><text x="625" y="473" fill="#f0fdf4" font-size="18">done</text><rect x="790" y="420" width="160" height="66" rx="14" fill="#2a1719" stroke="#f87171"/><text x="815" y="450" fill="#fca5a5" font-size="14">reason saved</text><text x="815" y="473" fill="#fff1f2" font-size="18">blocked</text>
<rect x="1120" y="210" width="390" height="330" rx="24" fill="#111820" stroke="#334155"/><text x="1155" y="255" fill="#c4b5fd" font-size="18">03  PERSIST ON DISK</text><text x="1155" y="310" fill="#f8fafc" font-size="20">~/.pi/missions/&lt;id&gt;/</text><text x="1185" y="355" fill="#93c5fd" font-size="18">plan.json</text><text x="1350" y="355" fill="#94a3b8" font-size="15">queue + pointer</text><text x="1185" y="397" fill="#93c5fd" font-size="18">history.jsonl</text><text x="1350" y="397" fill="#94a3b8" font-size="15">transitions</text><text x="1185" y="439" fill="#93c5fd" font-size="18">evidence/Fxxx.md</text><text x="1350" y="439" fill="#94a3b8" font-size="15">proof</text><text x="1185" y="481" fill="#93c5fd" font-size="18">sessions/</text><text x="1350" y="481" fill="#94a3b8" font-size="15">handoffs</text>
</g>
<path d="M420 315H515" stroke="url(#accent)" stroke-width="4"/><path d="M505 307l12 8-12 8" fill="none" stroke="#60a5fa" stroke-width="4"/><path d="M1025 375H1120" stroke="url(#accent)" stroke-width="4"/><path d="M1110 367l12 8-12 8" fill="none" stroke="#60a5fa" stroke-width="4"/>
<g filter="url(#shadow)"><rect x="210" y="650" width="1180" height="150" rx="28" fill="#101720" stroke="#334155"/><text x="255" y="700" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">NEW PI SESSION</text><text x="470" y="700" fill="#64748b" font-family="system-ui, sans-serif" font-size="20">→</text><text x="525" y="700" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">/mission load &lt;id&gt;</text><text x="860" y="700" fill="#64748b" font-family="system-ui, sans-serif" font-size="20">→</text><text x="915" y="700" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">same active feature</text><text x="255" y="752" fill="#9aa7b6" font-family="system-ui, sans-serif" font-size="20">Plan, evidence and history survive restart, compaction and context loss.</text></g>
</svg>