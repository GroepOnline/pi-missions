name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    #env:
      #NODE_OPTIONS: --experimental-sqlite
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-optional

      - name: Type check
        run: npm run check

      - name: Run tests (coverage on Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Run tests (no coverage)
        if: matrix.os != 'ubuntu-latest'
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test extension and CLI (cross-platform)
        run: npm run smoke:ci
